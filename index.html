      function useTheme() {
        const [theme, setTheme] = useState("light");
        useEffect(() => {
          let saved = null;
          try {
            saved = localStorage.getItem("gohar-doa-theme");
          } catch (e) {}
          const preferred =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          setTheme(preferred);
          document.documentElement.setAttribute("data-theme", preferred);
        }, []);
        const toggle = () => {
          const next = theme === "dark" ? "light" : "dark";
          setTheme(next);
          document.documentElement.setAttribute("data-theme", next);
          try {
            localStorage.setItem("gohar-doa-theme", next);
          } catch (e) {}
        };
        return [theme, toggle];
      }

      /* ---------- Order Modal ---------- */
      function ContactModal({ product, onClose }) {
        const [copiedId, setCopiedId] = useState(null);

        useEffect(() => {
          const onKey = (e) => {
            if (e.key === "Escape") onClose();
          };
          document.addEventListener("keydown", onKey);
          const prevOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          return () => {
            document.removeEventListener("keydown", onKey);
            document.body.style.overflow = prevOverflow;
          };
        }, [onClose]);

        const copy = async (phone) => {
          let ok = false;
          try {
            await navigator.clipboard.writeText(phone.copy);
            ok = true;
          } catch (e) {
            try {
              const ta = document.createElement("textarea");
              ta.value = phone.copy;
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
              ok = true;
            } catch (e2) {
              ok = false;
            }
          }
          if (ok) {
            setCopiedId(phone.id);
            setTimeout(
              () => setCopiedId((c) => (c === phone.id ? null : c)),
              2000,
            );
          }
        };

            className="modal-backdrop"
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div className="modal-box" role="dialog" aria-modal="true">
              <div className="flex items-start justify-between mb-4">
                <div>
                  <p className="font-display text-2xl mb-1">
                    {product ? "ثبت سفارش" : "تماس با ما"}
                  </p>
                  {product && (
                    <p
                      className="text-sm"
                      style={{ color: "var(--text-muted)" }}
                    >
                      {product.name}
                    </p>
                  )}
                </div>
                <button
                  onClick={onClose}
                  aria-label="بستن"
                  className="w-9 h-9 rounded-full flex items-center justify-center shrink-0"
                  style={{
                    border: "1px solid var(--border)",
                    color: "var(--text)",
                  }}
                >
                  <CloseIcon />
                </button>
              </div>

              <p
                className="text-sm leading-7 mb-5"
                style={{ color: "var(--text-muted)" }}
              >
                {product
                  ? "برای هماهنگی موجودی و ارسال، با یکی از شماره‌های زیر تماس بگیرید و نام همین محصول را اعلام کنید؛ یا شماره را کپی کنید و بعداً تماس بگیرید."
                  : "همکاران ما آماده پاسخگویی هستند. با یکی از شماره‌های زیر تماس بگیرید یا آن را کپی کنید."}
              </p>

              <div className="flex flex-col gap-3">
                {PHONES.map((phone, i) => (
                  <div key={phone.id} className="phone-row">
                    <div>
                      <span
                        className="block text-xs mb-0.5"
                        style={{ color: "var(--text-muted)" }}
                      >
                        {i === 0 ? "شماره اول" : "شماره دوم"}
                      </span>
                      <span className="font-display text-lg num">
                        {phone.display}
                      </span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => copy(phone)}
                        className={`copy-btn ${copiedId === phone.id ? "copied" : ""}`}
                      >
                        {copiedId === phone.id ? <CheckIcon /> : <CopyIcon />}
                        {copiedId === phone.id ? "کپی شد" : "کپی"}
                      </button>
                      <a
                        href={`tel:${phone.tel}`}
                        className="btn-primary text-sm py-2 px-3.5"
                      >
                        <PhoneIcon size={14} /> تماس
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      /* ---------- Details Modal ---------- */
      function DetailsModal({ product, onClose }) {
        useEffect(() => {
          const onKey = (e) => {
            if (e.key === "Escape") onClose();
          };
          document.addEventListener("keydown", onKey);
          const prevOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          return () => {
            document.removeEventListener("keydown", onKey);
            document.body.style.overflow = prevOverflow;
          };
        }, [onClose]);

        return (
          <div
            className="modal-backdrop"
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div className="modal-box" role="dialog" aria-modal="true">
              <div className="flex items-start justify-between mb-4">
                <div>
                  <p className="font-display text-2xl mb-1">توضیحات</p>
                  <p className="text-sm" style={{ color: "var(--text-muted)" }}>
                    {product.name}
                  </p>
                </div>
                <button
                  onClick={onClose}
                  aria-label="بستن"
                  className="w-9 h-9 rounded-full flex items-center justify-center shrink-0"
                  style={{
                    border: "1px solid var(--border)",
                    color: "var(--text)",
                  }}
                >
                  <CloseIcon />
                </button>
              </div>

              <p
                className="text-sm leading-8 whitespace-pre-line"
                style={{ color: "var(--text-muted)" }}
              >
                {product.details}
              </p>
            </div>
          </div>
        );
      }

      /* ---------- Sections ---------- */
      function Header({ theme, toggle, onOpenModal }) {
        const [open, setOpen] = useState(false);
        const links = [
          { href: "#home", label: "خانه" },
          { href: "#products", label: "محصولات" },
          { href: "#about", label: "درباره ما" },
          { href: "#contact", label: "تماس" },
        ];
        return (
          <header
            className="sticky  top-0 z-40 backdrop-blur "
            style={{
              background: "color-mix(in srgb, var(--bg) 88%, transparent)",
              borderBottom: "1px solid var(--border)",
            }}
          >
            <div className="container-px mx-auto flex items-center justify-between py-4 max-w-6xl">
              <a href="#home" className="flex items-center gap-2">
                <span
                  className="font-display text-2xl"
                  style={{ color: "var(--primary-strong)" }}
                >
                  نور هشتم
                </span>
              </a>
              <nav
                className="hidden md:flex items-center gap-8 text-sm font-medium"
                style={{ color: "var(--text-muted)" }}
              >
                {links.map((l) => (
                  <a
                    key={l.href}
                    href={l.href}
                    className="hover:opacity-100"
                    style={{ transition: "color .2s" }}
                    onMouseEnter={(e) =>
                      (e.currentTarget.style.color = "var(--primary-strong)")
                    }
                    onMouseLeave={(e) =>
                      (e.currentTarget.style.color = "var(--text-muted)")
                    }
                  >
                    {l.label}
                  </a>
                ))}
              </nav>
              <div className="flex items-center gap-2">
                <button
                  aria-label="تغییر پوسته"
                  onClick={toggle}
                  className="w-10 h-10 rounded-full flex items-center justify-center"
                  style={{
                    border: "1px solid var(--border)",
                    color: "var(--text)",
                  }}
                >
                  {theme === "dark" ? <SunIcon /> : <MoonIcon />}
                </button>
                <button
                  onClick={() => onOpenModal(null)}
                  className="hidden sm:inline-flex btn-primary text-sm py-2 px-4"
                >
                  <PhoneIcon size={16} /> تماس
                </button>
                <button
                  className="md:hidden w-10 h-10 rounded-full flex items-center justify-center"
                  style={{
                    border: "1px solid var(--border)",
                    color: "var(--text)",
                  }}
                  onClick={() => setOpen((o) => !o)}
                  aria-label="منو"
                  aria-expanded={open}
                >
                  <span className={`burger ${open ? "open" : ""}`}>
                    <span></span>
                    <span></span>
                    <span></span>
                  </span>
                </button>
              </div>
            </div>
            <div className={`md:hidden mobile-nav ${open ? "open" : ""}`}>
              <div
                className="container-px pb-4 flex flex-col gap-3 max-w-6xl mx-auto"
                style={{ borderTop: "1px solid var(--border)" }}
              >
                {links.map((l) => (
                  <a
                    key={l.href}
                    href={l.href}
                    onClick={() => setOpen(false)}
                    className="pt-3 text-sm font-medium"
                    style={{ color: "var(--text)" }}
                  >
                    {l.label}
                  </a>
                ))}
              </div>
            </div>
          </header>
        );
      }

      function Hero({ onOpenModal }) {
        return (
          <section id="home" className="relative overflow-hidden">
            <StarPattern className="hero-pattern absolute -left-24 -top-24 w-[420px] h-[420px] rotate-slow" />
            <div className="container-px mx-auto max-w-6xl pt-16 pb-24 md:pt-24 md:pb-32 relative rise-in">
              <p
                className="text-sm font-medium mb-4"
                style={{ color: "var(--primary-strong)" }}
              >
                زیورهای حرز، دست‌ساز و اصیل
              </p>
              <h1
                className="font-display text-4xl md:text-6xl leading-[1.35] max-w-4xl"
                style={{ color: "var(--text)" }}
              >
                آرامش و امنیت، هدیه حرز اصیل امام جواد (ع)
              </h1>
              <p
                className="mt-6 max-w-xl text-base md:text-lg leading-8"
                style={{ color: "var(--text-muted)" }}
              >
                «در فروشگاه “نور هشتم”، باور ما بر این است که حرز امام جواد (ع)
                تنها یک محصول نیست؛ بلکه دعوتی است برای آرامش و گشایش در زندگی.
                ما در این مجموعه، بیش از هر چیز بر “آداب کتابت” و “شرایط معنویِ”
                نگارش این حرز شریف تاکید داریم. تمامی مراحل با رعایت دقیق آداب و
                دستورات شرعی انجام شده تا آنچه به دست شما می‌رسد، با نهایتِ دقت
                و خلوص نیت تهیه شده باشد. از آنجا که معتقدیم این مسیر باید با
                پیوند قلبی و مشاوره آغاز شود، ثبت سفارش آنلاین نداریم. ما ترجیح
                می‌دهیم قبل از هر چیز، با شما صحبت کنیم تا بتوانیم محصولی در
                خورِ شأنِ شما و با رعایت کامل آداب، برایتان کنار بگذاریم.
              </p>
              <div className="mt-9 flex flex-wrap gap-4">
                <a href="#products" className="btn-primary">
                  مشاهده محصولات
                </a>
                <button onClick={() => onOpenModal(null)} className="btn-ghost">
                  <PhoneIcon size={16} /> تماس برای سفارش
                </button>
              </div>
            </div>
          </section>
        );
      }

      function About() {
        const points = [
          {
            title: "پناهگاه امنیت و آرامش",
            text: "دفع بلایا، بیماری‌ها و در امان ماندن از خطرات روزمره. حرز امام جواد (ع) همچون سپری در برابر چشم‌زخم و آسیب‌های جسمی و روحی است.",
          },
          {
            title: " گشایش درهای رزق و بخت",
            text: "همراه داشتن حرز، برکاتی فراتر از یک نماد دارد: از ایجاد امنیت پایدار در زندگی گرفته تا گشایش در رزق و روزی و بهبود روابط خانوادگی.",
          },
          {
            title: "تحکیم روابط و صمیمیت",
            text: " ایجاد آرامش در فضای خانه، بهبود روابط عاطفی و افزایش صمیمیت میان زوجین؛ راهکاری برای رفع کدورت‌ها و دوری از تنش‌های خانوادگی.",
          },
        ];
        return (
          <section
            id="about"
            className="py-20"
            style={{ background: "var(--bg-soft)" }}
          >
            <div className="container-px mx-auto max-w-7xl grid md:grid-cols-2 gap-12 items-center">
              <div>
                <h2 className="font-display text-3xl md:text-4xl mb-5">
                  {" "}
                  چرا حرز امام جواد (ع) همراهِ بسیاری از خانواده‌هاست؟
                </h2>
                <p className="leading-8" style={{ color: "var(--text-muted)" }}>
                  «حرز شریف امام جواد (ع) تنها یک ذکر یا نوشته نیست؛ بلکه
                  گنجینه‌ای است که از دیرباز برای حفاظت از جان و مال توصیه شده
                  است. تجربیاتِ سالیانِ متمادی نشان می‌دهد که همراه داشتن این
                  حرز، برکاتی فراتر از یک نماد دارد: از دفع خطرات، چشم‌زخم و
                  بیماری‌ها گرفته تا ایجاد امنیتِ پایدار در زندگی. بسیاری از
                  مراجعین ما برای برکت در رزق و روزی، گشایش بخت و همچنین برای
                  بهبود روابط خانوادگی و افزایش صمیمیت میان زوجین، به این حرز
                  متوسل می‌شوند. آرامشی که با همراه داشتن این حرز به قلب‌ها
                  می‌نشیند، گوهری است که “نور هشتم” مفتخر است اصیل‌ترین نسخه آن
                  را با رعایت کامل آداب، به شما تقدیم کند.»
                </p>
              </div>
              <div className="grid sm:grid-cols-1 gap-4">
                {points.map((p, i) => (
                  <div key={i} className="card p-5 flex items-start gap-4">
                    <div className="icon-tile w-11 h-11 flex items-center justify-center shrink-0 font-display text-lg num">
                      {i + 1}
                    </div>
                    <div>
                      <p className="font-semibold mb-1">{p.title}</p>
                      <p
                        className="text-sm"
                        style={{ color: "var(--text-muted)" }}
                      >
                        {p.text}
                      </p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      }

      function ProductCard({ p, onOpenOrder, onOpenDetails }) {
        const Icon = p.icon;
        const hasDetails = !!(p.details && p.details.trim());
        return (
          <div className="card p-6 flex flex-col h-full">
            <div className="flex items-start justify-between mb-5">
              <div className="icon-tile w-16 h-16 flex items-center justify-center">
                <Icon />
              </div>
              {p.tag && (
                <span
                  className="text-xs font-medium px-3 py-1 rounded-full"
                  style={{
                    background: "var(--surface-2)",
                    color: "var(--gold)",
                    border: "1px solid var(--border)",
                  }}
                >
                  {p.tag}
                </span>
              )}
            </div>
            <h3 className="font-semibold text-lg mb-2 leading-8">{p.name}</h3>
            <p
              className="text-sm leading-7 mb-5 flex-1"
              style={{ color: "var(--text-muted)" }}
            >
              {p.desc}
            </p>
            <div
              className="flex items-center justify-between gap-2 pt-4"
              style={{ borderTop: "1px solid var(--border)" }}
            >
              <span
                className="font-display num shrink-0"
                style={{
                  color: "var(--primary-strong)",
                  fontSize: hasDetails ? "1rem" : "1.25rem",
                }}
              >
                {toman(p.price)}
              </span>
              <div className="flex items-center gap-1.5 shrink-0">
                {hasDetails && (
                  <button
                    onClick={() => onOpenDetails(p)}
                    className="btn-ghost py-1.5 px-2.5 whitespace-nowrap"
                    style={{ fontSize: "0.78rem" }}
                  >
                    <InfoIcon size={13} /> توضیحات
                  </button>
                )}
                <button
                  onClick={() => onOpenOrder(p)}
                  className="btn-ghost py-1.5 px-2.5 whitespace-nowrap"
                  style={{ fontSize: "0.78rem" }}
                >
                  <PhoneIcon size={13} /> سفارش
                </button>
              </div>
            </div>
          </div>
        );
      }

      function Products({ onOpenOrder, onOpenDetails }) {
        return (
          <section id="products" className="py-20">
            <div className="container-px mx-auto max-w-6xl">
              <div className="mb-12 max-w-xl">
                <h2 className="font-display text-3xl md:text-4xl mb-4">
                  محصولات
                </h2>
                <p style={{ color: "var(--text-muted)" }}>
                  برای خرید هر کدام از این محصولات، روی «سفارش» بزنید و با
                  شماره‌ای که نمایش داده می‌شود تماس بگیرید.
                </p>
              </div>
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {PRODUCTS.map((p) => (
                  <ProductCard
                    key={p.id}
                    p={p}
                    onOpenOrder={onOpenOrder}
                    onOpenDetails={onOpenDetails}
                  />
                ))}
              </div>
            </div>
          </section>
        );
      }

      function Contact() {
        return (
          <section
            id="contact"
            className="py-20"
            style={{ background: "var(--bg-soft)" }}
          >
            <div className="container-px mx-auto max-w-6xl grid md:grid-cols-2 gap-10">
              <div>
                <h2 className="font-display text-3xl md:text-4xl mb-5">
                  سفارش با یک تماس
                </h2>
                <p
                  className="leading-8 mb-8"
                  style={{ color: "var(--text-muted)" }}
                >
                  همه محصولات به‌صورت تلفنی سفارش‌گیری می‌شوند. کارشناسان ما
                  موجودی، رنگ و زمان ارسال را برایتان توضیح می‌دهند.
                </p>
                <div className="flex flex-col gap-4">
                  {PHONES.map((phone, i) => (
                    <a
                      key={phone.id}
                      href={`tel:${phone.tel}`}
                      className="card p-5 flex items-center gap-4"
                    >
                      <span className="icon-tile w-12 h-12 flex items-center justify-center">
                        <PhoneIcon size={20} />
                      </span>
                      <span>
                        <span
                          className="block text-sm mb-1"
                          style={{ color: "var(--text-muted)" }}
                        >
                          {i === 0 ? "شماره تماس اول" : "شماره تماس دوم"}
                        </span>
                        <span className="font-display text-xl num">
                          {phone.display}
                        </span>
                      </span>
                    </a>
                  ))}
                  <a
                    href={SALAM_URL}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="card p-5 flex items-center gap-4"
                  >
                    <span className="icon-tile w-12 h-12 flex items-center justify-center">
                      <SalamIcon />
                    </span>
                    <span>
                      <span
                        className="block text-sm mb-1"
                        style={{ color: "var(--text-muted)" }}
                      >
                        فروشگاه ما در باسلام
                      </span>
                      <span className="font-display text-xl">
                        {SALAM_HANDLE}
                      </span>
                    </span>
                  </a>
                </div>
              </div>
              <div className="card p-8 flex flex-col justify-center">
                <p className="font-display text-2xl mb-4">ساعات پاسخگویی</p>
                <p> هر روز هفته هر ۲۴ ساعت</p>
                <div
                  className="mt-6 pt-6"
                  style={{ borderTop: "1px solid var(--border)" }}
                >
                  <p
                    className="text-sm leading-7"
                    style={{ color: "var(--text-muted)" }}
                  >
                    خرید فقط با تماس تلفنی انجام می‌شود؛ هیچ پرداخت آنلاینی از
                    شما درخواست نخواهد شد.
                  </p>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function Footer() {
        return (
          <footer
            className="py-8"
            style={{ borderTop: "1px solid var(--border)" }}
          >
            <div
              className="container-px mx-auto max-w-6xl flex flex-col sm:flex-row items-center justify-between gap-3 text-sm"
              style={{ color: "var(--text-muted)" }}
            >
              <span>
                © {new Date().getFullYear()} نور هشتم . تمامی حقوق محفوظ است.
              </span>
              <span>ساخته‌ شده توسط نور هشتم</span>
            </div>
          </footer>
        );
      }

      function CallFab({ onOpenModal }) {
        return (
          <button
            onClick={() => onOpenModal(null)}
            className="fixed bottom-6 left-6 z-50 w-14 h-14 rounded-full flex items-center justify-center pulse-ring"
            style={{
              background: "var(--primary-strong)",
              color: "var(--on-primary)",
              boxShadow: "var(--shadow)",
            }}
            aria-label="تماس برای سفارش"
          >
            <PhoneIcon size={22} />
          </button>
        );
      }

      function App() {
        const [theme, toggle] = useTheme();
        const [modalState, setModalState] = useState(null);
        // modalState: null | { type: "order", product } | { type: "details", product }
        const openOrderModal = (product) =>
          setModalState({ type: "order", product: product || null });
        const openDetailsModal = (product) =>
          setModalState({ type: "details", product });
        const closeModal = () => setModalState(null);

        return (
          <React.Fragment>
            <Header
              theme={theme}
              toggle={toggle}
              onOpenModal={openOrderModal}
            />
            <main>
              <Hero onOpenModal={openOrderModal} />
              <About />
              <Products
                onOpenOrder={openOrderModal}
                onOpenDetails={openDetailsModal}
              />
              <Contact />
            </main>
            <Footer />
            <CallFab onOpenModal={openOrderModal} />
            {modalState && modalState.type === "order" && (
              <ContactModal product={modalState.product} onClose={closeModal} />
            )}
            {modalState && modalState.type === "details" && (
              <DetailsModal product={modalState.product} onClose={closeModal} />
            )}
          </React.Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
