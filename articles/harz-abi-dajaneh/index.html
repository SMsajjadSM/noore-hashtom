  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
      <span class="loader-label">در حال بارگذاری فروشگاه...</span>
      <button class="loader-retry" onclick="location.reload()">
        بارگذاری طول کشید، دوباره تلاش کنید
      </button>
    </div>
    <div id="root"></div>

    <script>
      // Plain JS, no framework dependency: if the app hasn't mounted after
      // a while, surface a retry button instead of leaving a silent spinner.
      setTimeout(function () {
        var loader = document.getElementById("initial-loader");
        if (loader && !loader.classList.contains("hide")) {
          loader.classList.add("stuck");
        }
      }, 9000);
    </script>

  </body>
